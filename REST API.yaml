openapi: 3.1.0
info:
  title: Whistle Blower API
  version: 1.1.0
  description: |
    REST API for a Whistle Blower platform that supports anonymous reporting, 
    optional user accounts, evidence submission, communication between reporter 
    and investigator, analytics, and admin configuration.

servers:
  - url: https://api.example.com/api/v1
    description: Production Server
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Auth
  - name: Users
  - name: Reports
  - name: Evidence
  - name: Messages
  - name: Analytics
  - name: Admin Config

paths:
  # ---------------------------
  # AUTH
  # ---------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (optional)
      description: Allows users to create an account for better tracking and communication, but registration is optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201": { description: User registered successfully }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login to obtain JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string}
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logout successful }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        "200": { description: Password reset link sent }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ---------------------------
  # USERS
  # ---------------------------
  /users:
    get:
      tags: [Users]
      summary: Get list of users (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200": { description: User found }

    patch:
      tags: [Users]
      summary: Update user details (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200": { description: User updated }

  # ---------------------------
  # REPORTS
  # ---------------------------
  /reports:
    get:
      tags: [Reports]
      summary: Get all reports (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }

    post:
      tags: [Reports]
      summary: Submit a new report (anonymous or authenticated)
      description: |
        Submit a report anonymously or as a registered user.
        - Anonymous users must provide an **email** to receive updates.
        - Authenticated users' email is taken from their account.
        Updates are automatically sent to the provided email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201": { description: Report submitted successfully }

  /reports/my:
    get:
      tags: [Reports]
      summary: Get reports submitted by authenticated user
      description: |
        Only available to registered users.
        Anonymous reporters can track updates through their email instead.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of user's reports }

  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Get report details
      description: |
        Authenticated users can view their own reports.
        Anonymous reporters can access limited info through email link tokens.
      parameters:
        - $ref: "#/components/parameters/reportId"
      responses:
        "200": { description: Report details }

    patch:
      tags: [Reports]
      summary: Update report (admin or investigator)
      parameters:
        - $ref: "#/components/parameters/reportId"
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUpdate"
      responses:
        "200": { description: Report updated and email notifications sent }

  # ---------------------------
  # EVIDENCE
  # ---------------------------
  /reports/{reportId}/evidence:
    get:
      tags: [Evidence]
      summary: List evidence for a report
      parameters:
        - $ref: "#/components/parameters/reportId"
      description: |
        Available to the report owner (authenticated) or via secure email link for anonymous reporters.
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"

    post:
      tags: [Evidence]
      summary: Upload evidence for a report
      description: |
        Both anonymous and authenticated users can upload evidence related to their report.
        Anonymous upload requires a token sent to the reporter's email.
      parameters:
        - $ref: "#/components/parameters/reportId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Evidence uploaded successfully }

  # ---------------------------
  # MESSAGES
  # ---------------------------
  /reports/{reportId}/messages:
    get:
      tags: [Messages]
      summary: Get conversation messages related to a report
      description: |
        Authenticated users can access in-app chat.
        Anonymous reporters will receive new messages as email notifications instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/reportId"
      responses:
        "200": { description: List of messages }

    post:
      tags: [Messages]
      summary: Send a message in a report thread
      description: |
        Investigators and registered users can reply through the app.
        Anonymous reporters reply through special email reply links.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/reportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201": { description: Message sent and notifications distributed }

  # ---------------------------
  # ANALYTICS
  # ---------------------------
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Get dashboard overview (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Overview stats }

  /analytics/trends:
    get:
      tags: [Analytics]
      summary: Get report trends (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Trend data }

  /analytics/by-categories:
    get:
      tags: [Analytics]
      summary: Reports grouped by categories (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Category stats }

  /analytics/by-status:
    get:
      tags: [Analytics]
      summary: Reports grouped by status (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Status stats }

  /analytics/investigator-performance:
    get:
      tags: [Analytics]
      summary: Investigator performance metrics (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Investigator data }

  /analytics/reports/generate:
    post:
      tags: [Analytics]
      summary: Generate analytics report (PDF/Excel, admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Report generated }

  # ---------------------------
  # ADMIN CONFIG
  # ---------------------------
  /admin/config/categories:
    get:
      tags: [Admin Config]
      summary: Get categories
      responses:
        "200": { description: Category list }

    post:
      tags: [Admin Config]
      summary: Create category (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "201": { description: Category created }

  /admin/config/categories/{catId}:
    patch:
      tags: [Admin Config]
      summary: Update category (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/catId"
      responses:
        "200": { description: Category updated }

    delete:
      tags: [Admin Config]
      summary: Delete category (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/catId"
      responses:
        "204": { description: Category deleted }

  /admin/config/roles:
    get:
      tags: [Admin Config]
      summary: Get roles (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of roles }

    post:
      tags: [Admin Config]
      summary: Create role (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Role created }

  /admin/config/roles/{roleId}:
    patch:
      tags: [Admin Config]
      summary: Update role (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/roleId"
      responses:
        "200": { description: Role updated }

  /admin/config/settings:
    get:
      tags: [Admin Config]
      summary: Get global settings
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Settings retrieved }

    put:
      tags: [Admin Config]
      summary: Update global settings (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Settings updated }

  /admin/config/workflows:
    get:
      tags: [Admin Config]
      summary: Get workflow configuration (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workflow configuration retrieved }

    put:
      tags: [Admin Config]
      summary: Update workflow configuration (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workflow configuration updated }

# ---------------------------
# COMPONENTS
# ---------------------------

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    reportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    evidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string }
    catId:
      name: catId
      in: path
      required: true
      schema: { type: string }
    roleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string }

    Report:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Auto-incremented report ID
        title: { type: string }
        description: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [submitted, under_review, resolved, dismissed]
        reporterType:
          type: string
          enum: [anonymous, authenticated]
        email:
          type: string
          format: email
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReportCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        email:
          type: string
          format: email
          nullable: true
          description: |
            Optional email address for anonymous reporters to receive updates.
        status:
          type: string
          enum: [submitted, under_review, resolved, dismissed]
          default: submitted
        reporterType:
          type: string
          enum: [anonymous, authenticated]
          readOnly: true

    ReportUpdate:
      type: object
      properties:
        status: { type: string, enum: [submitted, under_review, resolved, dismissed] }
        notes: { type: string }

    Evidence:
      type: object
      properties:
        id: { type: string, format: uuid }
        reportId: { type: integer, format: int64 }
        fileUrl: { type: string, format: uri }
        fileName: { type: string }
        uploadedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        reportId: { type: integer, format: int64 }
        senderId: { type: string, nullable: true }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    MessageCreate:
      type: object
      required: [message]
      properties:
        message: { type: string }
        attachments:
          type: array
          items: { type: string, format: binary }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
